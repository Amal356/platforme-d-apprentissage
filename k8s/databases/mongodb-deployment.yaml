# =============================================================================
# MongoDB Deployment & Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: edumaster
  labels:
    app: mongodb
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        component: database
    spec:
      containers:
      - name: mongodb
        image: mongo:7
        ports:
        - containerPort: 27017
          name: mongodb
        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc
      - name: init-scripts
        configMap:
          name: mongodb-init-scripts

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: edumaster
  labels:
    app: mongodb
spec:
  type: ClusterIP
  ports:
  - port: 27017
    targetPort: 27017
    protocol: TCP
    name: mongodb
  selector:
    app: mongodb

---
# ConfigMap pour les scripts d'initialisation MongoDB
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-scripts
  namespace: edumaster
data:
  init.js: |
    // Script d'initialisation MongoDB pour EduMaster
    db = db.getSiblingDB('lms_users');
    
    // Créer les collections
    db.createCollection('users');
    db.createCollection('profiles');
    db.createCollection('sessions');
    
    // Créer les index
    db.users.createIndex({ "email": 1 }, { unique: true });
    db.users.createIndex({ "username": 1 }, { unique: true });
    db.profiles.createIndex({ "userId": 1 }, { unique: true });
    db.sessions.createIndex({ "userId": 1 });
    db.sessions.createIndex({ "expiresAt": 1 }, { expireAfterSeconds: 0 });
    
    print('MongoDB initialization completed for EduMaster');
