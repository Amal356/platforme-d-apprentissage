# =============================================================================
# Frontend (Next.js) Deployment & Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: edumaster
  labels:
    app: frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        component: frontend
    spec:
      containers:
      - name: frontend
        image: edumaster/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://nginx-gateway"
        - name: NEXT_PUBLIC_COURSE_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: COURSE_SERVICE_URL
        - name: NEXT_PUBLIC_USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: USER_SERVICE_URL
        - name: NEXT_PUBLIC_AI_TUTOR_URL
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: AI_TUTOR_SERVICE_URL
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: edumaster
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: frontend
