# =============================================================================
# AI Tutor Service Deployment & Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-tutor-service
  namespace: edumaster
  labels:
    app: ai-tutor-service
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-tutor-service
  template:
    metadata:
      labels:
        app: ai-tutor-service
        component: backend
    spec:
      containers:
      - name: ai-tutor-service
        image: edumaster/ai-tutor-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
          name: http
        env:
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: edumaster-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: edumaster-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: POSTGRES_DB
        - name: REDIS_URL
          value: "redis://$(REDIS_HOST):$(REDIS_PORT)/2"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: REDIS_PORT
        - name: OPENAI_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: OPENAI_BASE_URL
        - name: LLM_MODEL
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: LLM_MODEL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: edumaster-secrets
              key: OPENAI_API_KEY
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: ai-tutor-service
  namespace: edumaster
  labels:
    app: ai-tutor-service
spec:
  type: ClusterIP
  ports:
  - port: 8004
    targetPort: 8004
    protocol: TCP
    name: http
  selector:
    app: ai-tutor-service
