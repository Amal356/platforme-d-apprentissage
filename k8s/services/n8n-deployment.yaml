# =============================================================================
# n8n Automation Deployment & Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: edumaster
  labels:
    app: n8n
    component: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
        component: automation
    spec:
      containers:
      - name: n8n
        image: edumaster/n8n:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5678
          name: http
        env:
        - name: N8N_SECURE_COOKIE
          value: "false"
        - name: N8N_USER_MANAGEMENT_DISABLED
          value: "true"
        - name: DB_TYPE
          value: "postgresdb"
        - name: DB_POSTGRESDB_HOST
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: POSTGRES_HOST
        - name: DB_POSTGRESDB_PORT
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: POSTGRES_PORT
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: POSTGRES_DB
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: edumaster-secrets
              key: POSTGRES_USER
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: edumaster-secrets
              key: POSTGRES_PASSWORD
        - name: WEBHOOK_URL
          valueFrom:
            configMapKeyRef:
              name: edumaster-config
              key: WEBHOOK_URL
        volumeMounts:
        - name: n8n-storage
          mountPath: /home/node/.n8n
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: n8n-storage
        persistentVolumeClaim:
          claimName: n8n-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: n8n-service
  namespace: edumaster
  labels:
    app: n8n
spec:
  type: ClusterIP
  ports:
  - port: 5678
    targetPort: 5678
    protocol: TCP
    name: http
  selector:
    app: n8n
