# =============================================================================
# Secrets pour les mots de passe et clés sensibles
# IMPORTANT: En production, utilisez des outils comme Sealed Secrets ou External Secrets
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: edumaster-secrets
  namespace: edumaster
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_USER: "lms_user"
  POSTGRES_PASSWORD: "lms_password"
  
  # JWT
  JWT_SECRET: "your-secret-key-change-in-production"
  
  # MinIO
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "Admin@2026!Secure"
  
  # n8n (si authentification activée)
  N8N_EMAIL: "admin@edumaster.com"
  N8N_PASSWORD: "Amal123@"
  
  # Ollama API Key (si nécessaire)
  OPENAI_API_KEY: ""
  GROQ_API_KEY: ""
