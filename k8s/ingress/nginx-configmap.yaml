# =============================================================================
# Nginx ConfigMap pour la configuration du reverse proxy
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: edumaster
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        upstream frontend {
            server frontend-service:3000;
        }

        upstream course_service {
            server course-service:8001;
        }

        upstream user_service {
            server user-service:8002;
        }

        upstream analytics_service {
            server analytics-service:8003;
        }

        upstream ai_tutor_service {
            server ai-tutor-service:8004;
        }

        upstream n8n_service {
            server n8n-service:5678;
        }

        upstream minio_api {
            server minio-service:9000;
        }

        upstream minio_console {
            server minio-service:9001;
        }

        server {
            listen 80;
            server_name _;

            # Frontend
            location / {
                proxy_pass http://frontend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Course Service API
            location /api/courses {
                proxy_pass http://course_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # User Service API
            location /api/auth {
                proxy_pass http://user_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location /api/users {
                proxy_pass http://user_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # Analytics Service API
            location /api/analytics {
                proxy_pass http://analytics_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # AI Tutor Service API
            location /api/tutor {
                proxy_pass http://ai_tutor_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # n8n Webhooks
            location /webhook {
                proxy_pass http://n8n_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # MinIO API
            location /minio {
                proxy_pass http://minio_api;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }

        # n8n Admin Interface
        server {
            listen 5680;
            server_name _;

            location / {
                proxy_pass http://n8n_service;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
            }
        }

        # MinIO Console
        server {
            listen 9001;
            server_name _;

            location / {
                proxy_pass http://minio_console;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
            }
        }
    }
