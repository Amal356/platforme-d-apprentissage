# =============================================================================
# Nginx Gateway Deployment & Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: edumaster
  labels:
    app: nginx-gateway
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
        component: gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        - containerPort: 5680
          name: n8n
        - containerPort: 9001
          name: minio-console
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: edumaster
  labels:
    app: nginx-gateway
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
    name: http
  - port: 5680
    targetPort: 5680
    nodePort: 30568
    protocol: TCP
    name: n8n
  - port: 9001
    targetPort: 9001
    nodePort: 30901
    protocol: TCP
    name: minio-console
  selector:
    app: nginx-gateway
